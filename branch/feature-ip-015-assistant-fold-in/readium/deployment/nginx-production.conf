# IP-003 Phase 6 — Nginx production config for the Readium LCP stack.
#
# Public surface (HTTPS only):
#   - EvilFlowersCatalog Django app (this proxy)
#   - LCP Status Server  (via /readium/v1/licenses/{id}/{status,register,return,renew})
#   - License Gateway    (.lcpl downloads)
#   - Encrypted content  (the .lcpdf / encrypted file repository)
#
# Hidden from the public internet:
#   - LCP License Server (only reachable from this host on 127.0.0.1:8989)
#
# This config assumes:
#   - certbot or STU PKI-managed certs at /etc/ssl/lcp/*.pem
#   - Catalog on :8000, Status Server on :8990 (loopback), License Server on :8989 (loopback)
#   - Encrypted content files under /var/lib/evilflowers/readium/

server {
    listen 80;
    listen [::]:80;
    server_name catalog.example.org;

    # Always redirect plain HTTP. ACME challenges live above this in the cert tooling's vhost.
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name catalog.example.org;

    ssl_certificate     /etc/ssl/lcp/fullchain.pem;
    ssl_certificate_key /etc/ssl/lcp/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS: 6 months, include subdomains. Only set after you have verified all subdomains run HTTPS.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 200M;

    # Catalog application (handles /api/v1/..., /opds2/..., /readium/v1/...)
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Encrypted publication repository.
    # Files are AES-256-encrypted and safe to serve publicly.
    # Heavy `Cache-Control` is fine because the content keys live in the License Server.
    location /readium/v1/content/ {
        alias /var/lib/evilflowers/readium/encrypted/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types {
            application/pdf+lcp lcpdf;
            application/epub+zip+lcp lcpepub;
        }
    }
}

# NOTE: there is NO server{} block exposing the LCP License Server (:8989).
# It is bound to 127.0.0.1 by the systemd unit / Docker network and reachable
# only from the Catalog process and the Encryption Tool on this host.
