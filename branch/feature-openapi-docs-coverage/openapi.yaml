        "operationId": "CiteReferences.post",
        "summary": "Format references",
        "description": "Formatted references for citation addresses (#186), the MCP `cite` tool's payload: `{uris: [...], style}` \u2192 `{style, references: [{uri, text | csl}]}`. An address is `evilflowers://entry/<id>/locator/<key>` (a chat citation's `uri`), a `/cite/<id>/<key>` link, absolute or relative (its `url`), or `evilflowers://entry/<id>` for the whole publication. `style` is `iso690` (default, as Slovak theses use), `apa`, `bibtex` or `csl-json`. At most 50 addresses; each reference carries the page and the `/cite` link. Same access rules as the MCP tool: 404 for a publication or locator the caller may not see.",
        "tags": [
          "Content"
        ]
      }
    },
