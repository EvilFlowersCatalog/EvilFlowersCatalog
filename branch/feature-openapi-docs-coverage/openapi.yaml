        "operationId": "EntryFacets.get",
        "summary": "Facet counts for entry filters",
        "description": "Per-value entry counts for the language, category, feed, author, publisher, format (acquisition media type), full text (`fulltext`) and availability (`lcp_state`) filters, plus the publication year range. Accepts the same query parameters as `GET /api/v1/entries`. Each dimension is computed with every active filter applied except its own, so selecting a language still shows the other languages that could be OR-ed in. Only values with at least one entry are returned, sorted by count. Authors and publishers return the top `facet_limit` values (default 10); other dimensions are complete unless `facet_limit` is given. `facet=authors,publishers` computes only the named dimensions and `facet_query` searches inside them (e.g. author names). Availability counts use the `lcp_state` values plus the `reserved` pseudo-state (an entry the user has reserved is also counted under its LCP state).",
