  "tags": [
    {
      "name": "Catalogs",
      "description": "Catalogs are the tenants of the library. Every publication, feed and category lives in exactly one catalog, and users are granted access (`read`, `write`, `manage`) per catalog."
    },
    {
      "name": "Entries",
      "description": "Publications: their metadata, search, facets, suggestions and similarity, and the reading structure (chapters, figures, locators) built from their content."
    },
    {
      "name": "Authors",
      "description": "People credited on publications, shared by the entries that name them."
    },
    {
      "name": "Categories",
      "description": "The subject vocabulary of a catalog (for example its MDT/UDC classes). Entries are filed under the categories of their own catalog."
    },
    {
      "name": "Feeds",
      "description": "Curated, ordered lists of entries. Every feed is published as an OPDS navigation or acquisition feed."
    },
    {
      "name": "Acquisitions",
      "description": "The files of an entry (PDF, EPUB, \u2026) and their metadata."
    },
    {
      "name": "Files",
      "description": "Binary downloads: acquisition files, a reader's personalised copy, covers, thumbnails and the images of extracted regions."
    },
    {
      "name": "Reviews",
      "description": "Ratings and reviews of entries by readers, and their moderation."
    },
    {
      "name": "Graph",
      "description": "The knowledge graph built from publication content: related sections, prerequisites and concepts."
    },
    {
      "name": "User Acquisitions",
      "description": "A reader's own copy of an acquisition (for example a personalised PDF) and what it lets them do."
    },
    {
      "name": "Shelf Records",
      "description": "Entries a reader keeps on their shelf."
    },
    {
      "name": "Annotations",
      "description": "A reader's annotation sets on a publication."
    },
    {
      "name": "Annotation Items",
      "description": "The highlights and notes inside an annotation set."
    },
    {
      "name": "Activity",
      "description": "A reader's own reading and lending history."
    },
    {
      "name": "Licenses",
      "description": "Readium LCP licenses: issue and inspect them, download the `.lcpl`, and the License Status Document interactions reading apps perform (status, register, renew, return).",
      "externalDocs": {
        "url": "https://readium.org/lcp-specs/releases/lsd/latest",
        "description": "License Status Document specification"
      }
    },
    {
      "name": "Reservations",
      "description": "The queue for LCP titles without a free copy, including the claim page linked from the notification e-mail."
    },
    {
      "name": "Readium",
      "description": "Readium integration around a publication: availability, the Readium Web Publication Manifest, the encrypted content reading apps download and the passphrase hint page.",
      "externalDocs": {
        "url": "https://readium.org/architecture/",
        "description": "Readium architecture"
      }
    },
    {
      "name": "Encryption",
      "description": "LCP encryption of publications and the callbacks of the encryption worker."
    },
    {
      "name": "Content",
      "description": "Working with publication content: formatted references and citations."
    },
    {
      "name": "Content policies",
      "description": "Versioned policies that decide how much of a publication's text a caller may read, quote or export."
    },
    {
      "name": "Extraction",
      "description": "Text, region and paragraph extraction of publications, and the endpoints the extraction workers report to."
    },
    {
      "name": "Decider",
      "description": "The decision model that types relations between sections and decides what readers are shown, with the endpoints used to label its calibration cases."
    },
    {
      "name": "Assistant",
      "description": "The library assistant: chats grounded in the catalog, explanations and highlights."
    },
    {
      "name": "OPDS 1.2",
      "description": "Atom-based OPDS 1.2 catalog feeds for reading apps: navigation, acquisition and search.",
      "externalDocs": {
        "url": "https://specs.opds.io/opds-1.2",
        "description": "OPDS 1.2 specification"
      }
    },
    {
      "name": "OPDS 2.0",
      "description": "JSON-based OPDS 2.0 feeds, publications, authentication documents and borrowing.",
      "externalDocs": {
        "url": "https://drafts.opds.io/opds-2.0",
        "description": "OPDS 2.0 specification"
      }
    },
    {
      "name": "OAI-PMH",
      "description": "The OAI-PMH 2.0 provider for library aggregators, the ISBN resolver and availability lookups.",
      "externalDocs": {
        "url": "https://www.openarchives.org/OAI/openarchivesprotocol.html",
        "description": "OAI-PMH 2.0 specification"
      }
    },
    {
      "name": "Harvest",
      "description": "The harvesting client: external sources, their records, conflicts and the sync state of an entry."
    },
    {
      "name": "Dataverse",
      "description": "The hooks a Dataverse installation calls before it publishes a dataset."
    },
    {
      "name": "MCP",
      "description": "The Model Context Protocol server for AI clients, its OAuth protected-resource metadata and the signed upload links its tools hand out.",
      "externalDocs": {
        "url": "https://modelcontextprotocol.io/specification",
        "description": "Model Context Protocol specification"
      }
    },
    {
      "name": "Discovery",
      "description": "Well-known documents machines read without credentials, such as the W3C TDMRep reservations.",
      "externalDocs": {
        "url": "https://www.w3.org/community/tdmrep/",
        "description": "W3C TDM Reservation Protocol"
      }
    },
    {
      "name": "Users",
      "description": "User accounts, the caller's own profile and password."
    },
    {
      "name": "Tokens",
      "description": "Issue and refresh the JWT access tokens the API accepts as `Bearer` credentials."
    },
    {
      "name": "API Keys",
      "description": "Long-lived API keys for scripts and integrations."
    },
    {
      "name": "Notification Contacts",
      "description": "Where a user wants to be notified (e-mail addresses and other channels)."
    },
    {
      "name": "Notifications",
      "description": "Assets embedded in notification e-mails, such as the institution's logo."
    },
    {
      "name": "Settings",
      "description": "Instance settings an administrator can change at runtime."
    },
    {
      "name": "Jobs",
      "description": "Background jobs: what can run, what is running, and the runs' history."
    },
    {
      "name": "Status",
      "description": "Health and version of the instance and the services it depends on."
    },
    {
      "name": "Statistics",
      "description": "Lending statistics of the catalogs."
    },
    {
      "name": "Enums",
      "description": "Enumerations clients render as choices, such as languages."
    }
  ],
