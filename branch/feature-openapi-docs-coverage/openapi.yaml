        "operationId": "EntryPassages.get",
        "summary": "Search inside publications",
        "description": "Search inside publications (#113). Two rankings over the paragraphs of every processed PDF the caller may see (IP-018), fused by reciprocal rank: by meaning (the `query` embedded with multilingual-e5, IP-021) and by words (accents ignored; `\"a phrase\"`, `-excluded` and `or` as in entry search). Passages are grouped per publication by its best paragraph, best first; each says how it `matched` (`semantic`, `words`) and carries a `snippet`: HTML-escaped text with `<mark>` around the query's words, as `search.highlights` on entries. Other parameters of `GET /api/v1/entries` (e.g. `catalog_id`, `category_id`, `language`) narrow the publications searched. `per_entry` (1-3) passages per publication, `limit` publications (at most 24). A passage's `text` and `snippet` are null for entries lent through Readium LCP and outside the entry's allowed IP ranges; its `page` and score are still given. `degraded` is true when the query could not be embedded (word matches only); `indexed` counts the publications searchable by meaning, `searchable` those searchable by words. Resolve entries with `GET /api/v1/entries?id=...`.",
        "tags": [
          "Entries"
        ]
      }
    },
