        "operationId": "FigureSearch.get",
        "summary": "Search figures and tables",
        "description": "Find figures and tables across the library (#159): returns regions, not entries. `q` is matched by meaning (the region's caption, referring paragraph and description embedded with multilingual-e5) and by words (accents ignored), fused by reciprocal rank. `kind` is `figure`, `table` or both (`figure,table`, the default); equations are not searchable. Only publications the caller may see, inside their allowed IP ranges; of those lent through Readium LCP only the ones the caller has a live loan of. Each hit has a `crop_url` (the region as an image, same access check) and `downloadable`, whether a client may offer it for download (open access, printing and sharing allowed). Other parameters of `GET /api/v1/entries` (e.g. `catalog_id`, `category_id`) narrow the publications searched. `limit` hits, at most 50.",
