            "type": "boolean"
          },
          "reader_requirements": {
            "additionalProperties": true,
            "readOnly": true,
            "title": "Reader Requirements",
            "type": "object"
          },
          "renew_policy": {
            "additionalProperties": true,
            "description": "The renewal rules, published so clients stop guessing them.\n\nThe portal previously hardcoded its own extension options and had no\nway to know the server's bounds, so it offered choices the API always\nrefused (`requested_end` is capped at `now + max_renew_days`) and\ncould not explain the embargo to the user. Publishing the policy keeps\none source of truth: `evaluate_renew` and the UI read the same numbers.\n\n`embargo_days` is an upper bound: the embargo is capped at half the\nloan. Use `renewable_from` for this loan's actual date (#110).",
            "readOnly": true,
            "title": "Renew Policy",
            "type": "object"
          },
          "renewable_from": {
            "anyOf": [
              {
                "format": "date-time",
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "description": "When the renewal embargo lifts for this loan; `None` if it does not apply.\n\nComputed by the same helper `evaluate_renew` uses, so a client that\ndisables \"renew\" until this moment never offers a renewal the API\nrefuses for the embargo \u2014 and never withholds one it would allow.\nOther denials (queue, cap) still come back as a 403 with a `code`.",
            "readOnly": true,
            "title": "Renewable From"
          },
          "renewals_remaining": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "description": "IP-009 Phase 5 (Q6): None when `EVILFLOWERS_READIUM_MAX_RENEWALS`\nis unset (uncapped); otherwise `max(0, cap - renewal_count)`.",
            "readOnly": true,
            "title": "Renewals Remaining"
          }
        },
