[supervisord]
nodaemon=true
; IP-019: everything goes to the container's stdout/stderr, where Grafana Alloy
; reads it. Files inside the container are invisible to it. With nodaemon=true
; supervisord already echoes its own log to stdout; a logfile would only be a
; second, invisible copy (and /dev/stdout here printed every line twice).
logfile=/dev/null
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:gunicorn]
directory=/usr/src/app
command=/root/.local/bin/gunicorn evil_flowers_catalog.wsgi -c conf/gunicorn.conf.py --log-level=%(ENV_LOGLEVEL)s
autostart=true
autorestart=true
redirect_stderr=false
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:celery_event_handler]
directory=/usr/src/app
command=/usr/local/bin/python manage.py celery_event_handler
autostart=true
autorestart=true
redirect_stderr=false
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:celery_worker]
directory=/usr/src/app
command=/root/.local/bin/celery --quiet -A evil_flowers_catalog.celery worker --loglevel=%(ENV_LOGLEVEL)s
autostart=true
autorestart=true
redirect_stderr=false
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:celery_beats]
directory=/usr/src/app
command=/root/.local/bin/celery --quiet -A evil_flowers_catalog.celery beat --loglevel=%(ENV_LOGLEVEL)s -s /tmp/celerybeat-schedule
autostart=true
autorestart=true
redirect_stderr=false
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
