name: Docker build

on:
  push:
    branches: [ master, develop ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ develop ]

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1

# A newer push to develop (or a PR update) supersedes the running build + deploys: each deploy
# checks that the pods run the digest it built, so two overlapping runs would fail each other.
# master and release tags always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Install poetry
        run: |
          # Refresh the index first: the runner image's package lists go stale
          # and point at .deb versions the mirror has already dropped (404).
          # Skip recommends — pipx alone pulls in mkdocs, numpy, tornado, …
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pipx
          pipx ensurepath
          pipx install poetry
          pipx inject poetry poetry-plugin-export

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create requirements.txt
        run: |
          poetry export -f requirements.txt --without-hashes --output requirements.txt --with s3 --with pdf --with docker --with kafka --with otel

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-based caching - works properly for multi-arch builds
          # Each architecture gets its own cache manifest automatically
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
          # Provenance and SBOM for supply chain security
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        id: attest
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # A push to develop deploys :develop to every k3s instance that follows it, one after the other:
  # dev first, and KU only once dev rolled out and runs the pushed digest. The steps (restart by
  # label, rollout wait, digest check) are in deploy-k8s.yml; infra in the knowledge repo
  # (roles/evilflowers_k8s, roles/github_runner; vault Cookbooks/CI-Runner).

  # Development environment = k3s namespace evilflowers-dev (since 2026-11-07; the Compose unit
  # evilflowers-dev.service is disabled). With catalog_split (knowledge#37) the catalog runs as several
  # Deployments of one image (gunicorn, Celery worker(s), beat); the deploy restarts and digest-checks
  # them all by label, so worker and beat never lag behind the web code (#137).
  deploy:
    needs: build
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/develop'
      && github.repository == 'EvilFlowersCatalog/EvilFlowersCatalog'
    permissions: {}
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      environment: dev.evilflowers.elvira.stuba.sk
      url: https://dev.evilflowers.elvira.stuba.sk
      namespace: evilflowers-dev
      instance: dev
      digest: ${{ needs.build.outputs.digest }}

  # KU (Katolícka univerzita) = k3s namespace evilflowers-ku on KU's node e-knihy (since 2026-11-17;
  # knowledge evilflowers_instances.ku). KU's only environment, so this is KU's production: it follows
  # develop like dev does (KU runs the dev packages), gated on the dev deploy. Needs, in knowledge
  # (knowledge#91): evilflowers-ku in github_runner_deploy_namespaces, and the catalog image
  # on :develop instead of a digest pin (a pin fails this job before any restart).
  deploy-ku:
    needs: [build, deploy]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/develop'
      && github.repository == 'EvilFlowersCatalog/EvilFlowersCatalog'
    permissions: {}
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      environment: api.e-knihy.ku.sk
      url: https://api.e-knihy.ku.sk
      namespace: evilflowers-ku
      instance: ku
      digest: ${{ needs.build.outputs.digest }}
