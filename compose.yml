version: "2.4"
include:
  - ./dataverse/compose.yml

services:
  db:
    image: postgres:16
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: evil_flowers_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - shared

  db_init:
    image: postgres:16
    restart: "no"
    depends_on:
      - db
    networks:
      - shared
    volumes:
      - ./dataverse/db:/init
    command:
      - sh
      - -lc
      - >
        until pg_isready -h db -p 5432 -U postgres; do sleep 2; done;
        psql -h db -p 5432 -U postgres -d postgres -f /init/01_dataverse.sql
    environment:
      PGPASSWORD: postgres

  django:
    build: .
    volumes:
      - ./data/evilflowers/media:/usr/local/app/media
      - ./data/evilflowers/private:/usr/local/app/private
      - ./data/evilflowers/private:/mnt/data  # Mount for shared storage with text-service
      - ./logs:/var/log
    environment:
      DV_PUBLIC_INTERNAL: "http://dataverse:8080"
      DV_PUBLIC_BASE: http://localhost:8080
      DV_API_TOKEN: "538ce247-e209-4953-b1fd-35115e77dcc3" # change me
      DATAVERSE_WORKFLOW_SECRET: "123"
      REDIS_DATABASE: 1
      REDIS_HOST: redis
      SECURED_VIEW_JWT_REFRESH_TOKEN_EXPIRATION: 6000
      EVILFLOWERS_TEXT_SERVICE_URL: "http://host.docker.internal:8010"
      TEXT_SERVICE_REDIS_URL: "redis://redis:6379/0"
      EVILFLOWERS_CATALOG_API_INTERNAL_URL: "http://django:8000"
      PGHOST: db
      PGDATABASE: evil_flowers_catalog
      PGUSER: postgres
      PGPASSWORD: postgres
      DJANGO_SETTINGS_MODULE: evil_flowers_catalog.settings.development
