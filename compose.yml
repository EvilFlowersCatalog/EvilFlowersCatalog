      CELERY_BROKER_URL: "redis://redis:6379/7"
      CELERY_RESULT_BACKEND: "redis://redis:6379/7"
      EVILFLOWERS_EVENT_BROKER_EXECUTOR: "apps.events.services.CeleryEventExecutionService"
      EVILFLOWERS_EVENT_BROKER_TRANSFORMER: "apps.events.transformers.DjangoTransformer"
      # Readium LCP Configuration
      EVILFLOWERS_READIUM_LCPSV_URL: "http://readium:8989"
      EVILFLOWERS_READIUM_LSDSV_URL: "http://readium:8990"
      EVILFLOWERS_READIUM_LCPENCRYPT_NOTIFY_URL: "http://django:8000/api/readium/hooks/encryption"
      # Logfire (uncomment to enable)
      # LOGFIRE_TOKEN: ""
      # LOGFIRE_SERVICE_NAME: "evilflowers-catalog"
      # LOGFIRE_ENVIRONMENT: "development"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - readium
    networks:
      - shared

  redis:
    image: "redis:7"
    command: redis-server
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    environment:
      REDIS_REPLICATION_MODE: master

  readium:
    image: "ghcr.io/evilflowerscatalog/readium-lcp-server:master"
    volumes:
      - ./data/readium/db:/usr/local/var/readium/db
      - ./data/readium/storage:/usr/local/var/readium/storage
      - ./data/evilflowers/private:/usr/local/app/private
      - ./data/logs/readium:/var/log/readium
      - ./data/readium/config.yaml:/usr/local/etc/readium/config.yaml
      - ./data/readium/htpasswd:/usr/local/etc/readium/htpasswd
      - ./data/readium/cert/cert.pem:/usr/local/var/readium/lcp/cert/cert.pem
      - ./data/readium/cert/privkey.pem:/usr/local/var/readium/lcp/cert/privkey.pem
    ports:
      - "8988:8988"

  evilflowers-ocr-worker:
    image: "ghcr.io/evilflowerscatalog/evilflowers-ocr-worker:master"
    environment:
      BROKER: "redis://redis:6379/7"
      STORAGE_PATH: /usr/local/app/private
    volumes:
      - ./data/evilflowers/private:/usr/local/app/private
    depends_on:
      - redis
    networks:
      - shared  

  evilflowers-text-service:
    image: "ghcr.io/evilflowerscatalog/evilflowers-text-service:main"
    platform: linux/amd64
    container_name: text-service
    environment:
      REDIS_URL: "redis://redis:6379/0"
      STORAGE_PATH: /mnt/data
      SEARCH_SERVICE_URL: ${SEARCH_SERVICE_URL:-http://search-service:8001}
      TABLE_EXTRACTOR: "PdfPlumber"
      TEXT_EXTRACTOR_MODE: "None"
      CATALOG_API_URL: "http://django:8000"
      CATALOG_SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./data/evilflowers/private:/mnt/data
    networks:
      - shared
    depends_on:
      - redis
      - evil-flowers-search-service

  evil-flowers-search-service:
    image: "ghcr.io/evilflowerscatalog/evilflowers-search-service:main"
    platform: linux/amd64
    container_name: search-service
    ports:
      - "8001:8001"
    environment:
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-http://elasticsearch:9200}
      - USE_MILVUS_LITE=true
    networks:
      - shared
   
volumes:
  minio-data: