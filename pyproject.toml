[tool.poetry]
name = "evil_flowers_catalog"
version = "0.14.0"
description = "Publication catalog compatible with OPDS"
authors = ["Jakub Dubec <jakub.dubec@stuba.sk>"]

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.0"
django_api_forms = "1.0.0rc11"
python-dotenv = "^1.0"
argon2-cffi = "^25.1.0"
psycopg = {version = "^3.3", extras = ["c", "pool"]}
django-imap-backend = "^0"
django-filter = "^25.2"
Pillow = "^12"
pycountry = "^26.2"
django-object-checker = "^1.0.0"
joserfc = "^1.6"
tzdata = "^2026.1"
django-cors-headers = "^4.9"
python-ldap = "^3.4.0"
qrcode = "^8.2"
bibtexparser = "^1.4.0"
isbnlib = { git = "https://github.com/EvilFlowersCatalog/isbnlib.git" }
django-partial-date = "^1.3.2"
pydantic = "^2.12"
pydantic-xml = { version = "^2.19.0", extras = ["lxml"] }
email-validator = "^2.3"
hiredis = "^3.3"
celery = {version = "^5.6.0", extras = ["redis"]}
setuptools = "*"
requests = "^2.32.4"
mjml-python = "^1.3.7"
pgvector = "^0.4"
# IP-019: the application code (spans, metrics, log trace ids) uses the API only,
# which is a no-op without the SDK from the `otel` group. Same release train.
opentelemetry-api = "1.45.2"

[tool.poetry.group.s3.dependencies]
minio = "^7.2"

[tool.poetry.group.pdf.dependencies]
pymupdf = "^1.27"

# IP-019: OpenTelemetry SDK, OTLP/HTTP exporter, instrumentations and resource
# detectors. Pinned to one opentelemetry-python release train: SDK/exporter
# 1.x and contrib 0.yb0 must move together.
[tool.poetry.group.otel.dependencies]
opentelemetry-sdk = "1.45.2"
opentelemetry-exporter-otlp-proto-http = "1.45.2"
opentelemetry-instrumentation = "0.66b2"
opentelemetry-instrumentation-django = "0.66b2"
opentelemetry-instrumentation-psycopg = "0.66b2"
opentelemetry-instrumentation-redis = "0.66b2"
opentelemetry-instrumentation-celery = "0.66b2"
opentelemetry-instrumentation-requests = "0.66b2"
opentelemetry-instrumentation-system-metrics = "0.66b2"
opentelemetry-resource-detector-containerid = "0.66b2"

[tool.poetry.group.docker.dependencies]
gunicorn = "^25.0.0"
gevent = "*"
wheel = "*"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
datamodel-code-generator = { version = "^0.25.2", extras = ["http"] }


[tool.poetry.group.kafka.dependencies]
kafka-python = "^2.1.5"
# Used only when the Kafka event executor is configured (IP-019).
opentelemetry-instrumentation-kafka-python = "0.66b2"

[tool.black]
line-length = 119
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.github
  | .venv
  | data
  | logs
  | media
  | private
  | static
  | conf
  | \.stoplight
)/
'''

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.masonry.api"
